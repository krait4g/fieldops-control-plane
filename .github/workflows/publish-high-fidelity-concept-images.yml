name: Publish high-fidelity concept images

on:
  push:
    branches:
      - transport/q40-concept-images
    paths:
      - .image-transport/ready

permissions:
  contents: write

jobs:
  decode-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          ref: transport/q40-concept-images

      - name: Decode source payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fieldops-images
          cat .image-transport/hero.part*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/fieldops-images/product-vision-hero.webp
          cat .image-transport/capability.part*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/fieldops-images/capability-overview-concept.webp
          cat .image-transport/screen.part*.b64 | tr -d '\r\n ' | base64 --decode > /tmp/fieldops-images/screen-concept.webp

      - name: Verify exact bytes and WebP containers
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s /tmp/fieldops-images/product-vision-hero.webp)" = "23242"
          test "$(stat -c%s /tmp/fieldops-images/capability-overview-concept.webp)" = "26162"
          test "$(stat -c%s /tmp/fieldops-images/screen-concept.webp)" = "19292"

          printf '%s  %s\n' \
            'de3128a3a1cda97bb7364f933fc95d514aa6103a19357b2d570ed715865a8d10' \
            '/tmp/fieldops-images/product-vision-hero.webp' | sha256sum --check --strict
          printf '%s  %s\n' \
            'f74ed7e374e8390d6e9041fbfcefba536bcd23a5cb45bc7a81ca01868c5bb404' \
            '/tmp/fieldops-images/capability-overview-concept.webp' | sha256sum --check --strict
          printf '%s  %s\n' \
            'b11208326105f28e114c7d078f435961f65bc40be647cba5445329e17133c5b9' \
            '/tmp/fieldops-images/screen-concept.webp' | sha256sum --check --strict

          file /tmp/fieldops-images/*.webp | tee /tmp/fieldops-images/file-report.txt
          test "$(grep -c 'Web/P image' /tmp/fieldops-images/file-report.txt)" = "3"

      - name: Create clean publication branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B fix/high-fidelity-concept-images origin/master
          cp /tmp/fieldops-images/product-vision-hero.webp docs/assets/product-vision-hero.webp
          cp /tmp/fieldops-images/capability-overview-concept.webp docs/assets/capability-overview-concept.webp
          cp /tmp/fieldops-images/screen-concept.webp docs/assets/screen-concept.webp

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/product-vision-hero.webp \
                  docs/assets/capability-overview-concept.webp \
                  docs/assets/screen-concept.webp
          git commit -m 'fix: restore high-fidelity concept images'
          git push -u origin HEAD:fix/high-fidelity-concept-images
