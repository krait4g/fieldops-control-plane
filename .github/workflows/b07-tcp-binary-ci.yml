name: TCP Binary Adapter

on:
  pull_request:
    paths:
      - "apps/**"
      - "modules/telemetry-*/**"
      - "fixtures/b07/**"
      - "infra/b07/**"
      - "scripts/b02_observe.py"
      - "scripts/b07_tcp_binary.py"
      - "tests/repository-tests/test_b07_tcp_binary.py"
      - "docs/adr/0018-b07-tcp-binary-framing.md"
      - "gradle/**"
      - "*.gradle.kts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/b07-tcp-binary-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b07-tcp-binary-gate:
    name: TCP/Binary scenarios and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: pnpm install --frozen-lockfile
      - name: Install actual Chromium
        run: pnpm --filter @fieldops/web-console exec playwright install --with-deps chromium
      - name: Check TCP/Binary helpers
        run: python3 tests/repository-tests/test_b07_tcp_binary.py
      - name: Start TCP/Binary runtime
        run: python3 scripts/b07_tcp_binary.py up
      - name: Check TCP/Binary runtime
        run: python3 scripts/b07_tcp_binary.py status
      - name: Verify TCP/Binary scenarios
        run: python3 scripts/b07_tcp_binary.py verify
      - name: Prepare synthetic browser credential
        shell: bash
        run: |
          credential=$(python3 -c "import json; print(json.load(open('.fieldops-b07/b02/demo-credentials.json'))['password'])")
          echo "::add-mask::$credential"
          echo "B02_BROWSER_USERNAME=b02-admin-a" >> "$GITHUB_ENV"
          echo "B02_BROWSER_PASSWORD=$credential" >> "$GITHUB_ENV"
      - name: Run TCP device browser journey
        run: pnpm --filter @fieldops/web-console exec playwright test -c playwright.b07.config.ts
      - name: Stop TCP/Binary runtime
        if: always()
        run: python3 scripts/b07_tcp_binary.py down
      - name: Upload TCP/Binary test output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7
        with:
          name: tcp-binary-checks-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: .fieldops-b07/last-verify.json
