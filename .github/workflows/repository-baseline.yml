name: Repository Baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify repository baseline
        run: |
          python scripts/verify_repository_baseline.py
          python tests/repository-tests/test_b02_observe.py
          python tests/repository-tests/test_b04_camera.py
          python tests/repository-tests/test_b05_command.py
