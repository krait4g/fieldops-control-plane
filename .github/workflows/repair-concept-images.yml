name: Repair concept image binaries

on:
  push:
    branches:
      - fix/concept-image-binaries
    paths:
      - .image-upload/ready

permissions:
  contents: write

jobs:
  decode-validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/concept-image-binaries

      - name: Decode exact WebP binaries
        shell: bash
        run: |
          set -euo pipefail
          cat .image-upload/hero.part*.b64 | tr -d '\r\n ' | base64 --decode > docs/assets/product-vision-hero.webp
          cat .image-upload/capability.part*.b64 | tr -d '\r\n ' | base64 --decode > docs/assets/capability-overview-concept.webp
          cat .image-upload/screen.part*.b64 | tr -d '\r\n ' | base64 --decode > docs/assets/screen-concept.webp

      - name: Verify byte length and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c%s docs/assets/product-vision-hero.webp)" = "23242"
          test "$(stat -c%s docs/assets/capability-overview-concept.webp)" = "26162"
          test "$(stat -c%s docs/assets/screen-concept.webp)" = "19292"

          printf '%s  %s\n' \
            'de3128a3a1cda97bb7364f933fc95d514aa6103a19357b2d570ed715865a8d10' \
            'docs/assets/product-vision-hero.webp' | sha256sum --check --strict
          printf '%s  %s\n' \
            'f74ed7e374e8390d6e9041fbfcefba536bcd23a5cb45bc7a81ca01868c5bb404' \
            'docs/assets/capability-overview-concept.webp' | sha256sum --check --strict
          printf '%s  %s\n' \
            'b11208326105f28e114c7d078f435961f65bc40be647cba5445329e17133c5b9' \
            'docs/assets/screen-concept.webp' | sha256sum --check --strict

      - name: Verify WebP containers
        shell: bash
        run: |
          set -euo pipefail
          file docs/assets/product-vision-hero.webp | tee /tmp/hero-file.txt
          file docs/assets/capability-overview-concept.webp | tee /tmp/capability-file.txt
          file docs/assets/screen-concept.webp | tee /tmp/screen-file.txt
          grep -q 'Web/P image' /tmp/hero-file.txt
          grep -q 'Web/P image' /tmp/capability-file.txt
          grep -q 'Web/P image' /tmp/screen-file.txt

      - name: Commit repaired images and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/product-vision-hero.webp \
                  docs/assets/capability-overview-concept.webp \
                  docs/assets/screen-concept.webp
          git rm -r .image-upload
          git rm .github/workflows/repair-concept-images.yml
          git commit -m 'fix: restore valid concept image binaries'
          git push origin HEAD:fix/concept-image-binaries
