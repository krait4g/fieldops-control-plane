# B02 localhost-only synthetic broker. Credentials are generated under .fieldops-b02.
persistence false
allow_anonymous false
password_file /run/fieldops-mqtt/passwd
acl_file /mosquitto/config/b02.acl
listener 1883 0.0.0.0

log_dest stdout
log_type error
log_type warning
connection_messages true

max_packet_size 65536
max_inflight_messages 256
max_queued_messages 256
